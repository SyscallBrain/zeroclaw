# Builds the ZeroClaw daemon for the owner's phone (Termux,
# aarch64-linux-android), only when it is started by hand. Nothing is
# published: the binary is kept as a run artifact for 7 days.
#
# Modes:
#   sync   1. fetches upstream master (zeroclaw-labs/zeroclaw);
#          2. rebases each patch branch (PATCHES) onto it;
#          3. recreates the phone branch = master + merge --no-ff of each patch;
#          4. builds;
#          5. only if all of that worked, and with publish=true, pushes
#             master, the patch branches and the phone branch to this fork.
#          A rebase conflict stops the run and names the patch and the files;
#          the fork is left untouched.
#   build  builds the phone branch exactly as it is in the fork.
#
# Start it (from Termux, or anywhere with gh):
#   gh workflow run phone-build.yml -R SyscallBrain/zeroclaw                    # sync + publish
#   gh workflow run phone-build.yml -R SyscallBrain/zeroclaw -f publish=false   # try without touching the fork
#   gh workflow run phone-build.yml -R SyscallBrain/zeroclaw -f mode=build
# Follow it and fetch the binary from that same run (the newest run of this
# workflow; gh run download without a run id would ask which run):
#   run=$(gh run list -R SyscallBrain/zeroclaw -w phone-build.yml -L 1 --json databaseId -q '.[0].databaseId')
#   gh run watch "$run" -R SyscallBrain/zeroclaw --exit-status
#   gh run download "$run" -R SyscallBrain/zeroclaw
# Artifacts are zips, which drop the executable bit, so then:
#   chmod +x zeroclaw-*/zeroclaw
#
# This file lives on "phone-ci", the fork's default branch, which holds only
# this workflow and a README, so the fork's master stays identical to upstream.
name: Phone daemon build (manual)

# The only trigger is "Run workflow" / "gh workflow run".
on:
  workflow_dispatch:
    inputs:
      mode:
        description: sync = upstream + patches, then build; build = build the phone branch as it is
        type: choice
        options: [sync, build]
        default: sync
      publish:
        description: (sync only) after a clean build, push the branches to the fork
        type: boolean
        default: true

permissions: {}

# Two runs at once could push different branches: the second one waits.
concurrency:
  group: phone-daemon
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/zeroclaw-labs/zeroclaw.git
  # The branch the phone runs.
  PHONE_BRANCH: android-master-zerodroid
  # Patch branches, merged in this order. Edit this list to add or drop one.
  PATCHES: >-
    zerodroid/remote-durable-session-owner
    zerodroid/cron-rpc-parity
    zerodroid/android-process-cpu
  RUST_VERSION: 1.99.1
  TARGET: aarch64-linux-android
  NDK_VERSION: 29.0.14206865
  # The same features as the binary the phone ran before (default + extras).
  FEATURES: >-
    acp-bridge agent-runtime channel-acp-server channel-discord channel-email
    channel-filesystem channel-git channel-lark channel-matrix channel-telegram
    channel-webhook gateway observability-prometheus schema-export
    tool-claude-code tool-claude-code-runner tool-codex-cli tool-composio
    tool-gemini-cli tool-google-workspace tool-jira tool-linkedin
    tool-microsoft365 tool-notion tool-opencode-cli tool-project-intel
    tools-external
  CARGO_TERM_COLOR: always

jobs:
  daemon:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    # The automatic token only reads. Pushes use ZEROCLAW_PUSH_TOKEN (see the
    # last step for why the automatic token cannot do them).
    permissions:
      contents: read
    steps:
      # The LTO build needs many GB; drop toolchains this job never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/boost
          df -h /

      - name: Check the push token
        if: inputs.mode == 'sync' && inputs.publish
        env:
          PUSH_TOKEN: ${{ secrets.ZEROCLAW_PUSH_TOKEN }}
        run: |
          if [ -z "$PUSH_TOKEN" ]; then
            echo "::error::The ZEROCLAW_PUSH_TOKEN secret is not set. Run with -f publish=false or add the token."
            exit 1
          fi

      # Full history (fetch-depth 0): the rebase and "git describe" need it.
      - name: Check out the fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PHONE_BRANCH }}
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git
        run: |
          git config user.name SyscallBrain
          git config user.email 61458775+SyscallBrain@users.noreply.github.com
          git remote add upstream "$UPSTREAM"
          # Upstream tags: "zeroclaw --version" shows git describe (v0.9.0-N-g<sha>).
          git fetch --quiet --tags upstream master

      - name: Sync with upstream and apply the patches
        if: inputs.mode == 'sync'
        run: |
          set -euo pipefail
          # Where each branch was in the fork, for the --force-with-lease push.
          : > "$RUNNER_TEMP/old-shas"
          for b in master $PATCHES $PHONE_BRANCH; do
            echo "$b $(git rev-parse "origin/$b")" >> "$RUNNER_TEMP/old-shas"
          done

          base=$(git rev-parse upstream/master)
          echo "upstream master: $base ($(git log -1 --format=%s "$base"))"
          echo "new upstream commits since the last sync: $(git rev-list --count origin/master..upstream/master)"

          for p in $PATCHES; do
            git checkout --quiet -B "$p" "origin/$p"
            echo "::group::rebase $p"
            if ! git rebase "$base"; then
              echo "::endgroup::"
              echo "::error title=Conflict in $p::Rebasing $p onto upstream master conflicts in:"
              git diff --name-only --diff-filter=U | sed 's/^/    /'
              git rebase --abort
              echo "Nothing was pushed. Resolve the conflict by hand and run again."
              exit 1
            fi
            echo "::endgroup::"
            git log --oneline "$base..$p"
          done

          git checkout --quiet -B "$PHONE_BRANCH" "$base"
          for p in $PATCHES; do
            if ! git merge --no-ff --no-edit "$p"; then
              echo "::error title=Conflict merging $p::The patches conflict with each other in:"
              git diff --name-only --diff-filter=U | sed 's/^/    /'
              exit 1
            fi
          done
          git log --oneline --graph -n 12

      - name: Install Rust and the Android NDK
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target "$TARGET"
          rustup default "$RUST_VERSION"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          # zeroclaw's .cargo/config.toml links with aarch64-linux-android21-clang:
          # putting the NDK's bin directory on PATH is all it needs.
          echo "$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      # Keeps ~/.cargo and target/ between runs: the first build is slow,
      # later ones only rebuild what changed.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ env.TARGET }}

      - name: Build the daemon
        run: |
          features=$(printf "%s" "$FEATURES" | tr -s " " ",")
          cargo build --release --locked --target "$TARGET" \
            --no-default-features --features "$features" --bin zeroclaw

      - name: Label the binary
        env:
          MODE: ${{ inputs.mode }}
        run: |
          bin="target/$TARGET/release/zeroclaw"
          file "$bin"
          describe=$(git describe --tags --always)
          echo "DESCRIBE=$describe" >> "$GITHUB_ENV"
          mkdir out
          cp "$bin" out/zeroclaw
          {
            echo "git describe:    $describe"
            echo "phone branch:    $PHONE_BRANCH @ $(git rev-parse HEAD)"
            echo "upstream master: $(git rev-parse upstream/master)"
            for p in $PATCHES; do
              echo "patch:           $p @ $(git rev-parse --verify -q "refs/heads/$p" || git rev-parse "origin/$p")"
            done
            echo "mode:            $MODE"
            echo "run:             $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > out/BUILD-INFO.txt
          (cd out && sha256sum zeroclaw > SHA256SUMS && cat SHA256SUMS BUILD-INFO.txt)

      - name: Upload the binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zeroclaw-${{ env.DESCRIBE }}
          path: out/
          if-no-files-found: error
          retention-days: 7

      # Reached only after a clean build. GitHub's automatic token may not push
      # commits that touch .github/workflows (upstream often does), so this uses
      # a personal token scoped to this fork.
      - name: Publish the branches to the fork
        if: inputs.mode == 'sync' && inputs.publish
        env:
          PUSH_TOKEN: ${{ secrets.ZEROCLAW_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          url="https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          args=()
          while read -r b old; do
            # Rewrite a branch only if it is still where it was when the run
            # started, so work pushed meanwhile is never lost.
            args+=("--force-with-lease=refs/heads/$b:$old")
          done < "$RUNNER_TEMP/old-shas"
          refs=("upstream/master:refs/heads/master")
          for b in $PATCHES $PHONE_BRANCH; do refs+=("refs/heads/$b:refs/heads/$b"); done
          git push --atomic "${args[@]}" "$url" "${refs[@]}"
